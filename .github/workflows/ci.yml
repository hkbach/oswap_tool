# CI for this repository (FR-QA-07): lint, offline tests, dependency audit, secret scan.
# Branch protection on main ("require status checks to pass") is a GitHub setting
# that a repository admin turns on; see README "Branch protection for main".
name: ci

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported (requires-python) and latest Python.
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,service]"
      # The suite only talks to mock servers on 127.0.0.1.
      - run: python -m pytest -q -rs

  min-deps:
    # The lowest versions pyproject.toml allows, on the oldest supported Python: a floor that
    # is too low (requests 2.31 broke --ca-bundle) only shows up here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,service]" "requests==2.32.3" "urllib3==2.0.0" "cryptography==42.0.0" "pyyaml==6.0.1" "fastapi==0.115.0" "uvicorn==0.30.0"
      - run: python -m pytest -q -rs

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "pip-audit==2.10.1"
      # Resolves and audits the runtime dependencies declared in pyproject.toml.
      - run: python -m pip_audit --progress-spinner off .
      # The agency API (decision D12) is the first part of the product meant to face a network, so the
      # optional `service` dependencies are audited too, in an environment of their own.
      - name: Audit the service dependencies
        run: |
          python -m venv /tmp/service-env
          /tmp/service-env/bin/python -m pip install --upgrade pip
          /tmp/service-env/bin/python -m pip install ".[service]"
          python -m pip_audit --progress-spinner off --path "$(echo /tmp/service-env/lib/python*/site-packages)"

  docker:
    # FR-CI-04: the official image builds, runs as a non-root user, and can complete a scan.
    # Linux only: needs a Docker daemon and --network host to reach the runner's own mock
    # server from inside the container.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t websec-scanner:ci .
      - run: docker run --rm websec-scanner:ci --help
      - run: docker run --rm websec-scanner:ci --list-checks
      - name: Refuses to run as root
        run: |
          uid=$(docker run --rm --entrypoint id websec-scanner:ci -u)
          test "$uid" -ne 0
      - name: Scan a mock server over --network host
        run: |
          python3 tests/mock_server.py 8899 &
          sleep 1
          docker run --rm --network host websec-scanner:ci \
            http://127.0.0.1:8899 --yes --no-color --fail-on none

  docker-publish:
    # FR-CI-04: publish the image the "docker" job above already built and smoke-tested,
    # only for a release tag (v*), to ghcr.io. Uses this run's own GITHUB_TOKEN
    # (job-scoped packages: write below), not a repository secret anyone has to configure.
    needs: docker
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/hkbach/websec-scanner
    steps:
      - uses: actions/checkout@v7
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: docker build -t "$IMAGE:${{ github.ref_name }}" -t "$IMAGE:latest" .
      - run: docker push "$IMAGE:${{ github.ref_name }}"
      - run: docker push "$IMAGE:latest"

  secrets:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan the whole history
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner
