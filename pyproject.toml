[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "owasp-scanner"
dynamic = ["version"]
description = "OWASP-aligned non-intrusive web security configuration scanner (CLI + local web UI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3",  # _TrustAdapter relies on build_connection_pool_key_attributes() behaviour of 2.32.3
    "urllib3>=2.0.0",
    "cryptography>=42.0.0",  # not_valid_before_utc / not_valid_after_utc
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.14,<0.15",
    "jsonschema>=4.18",
]

[project.scripts]
owasp-scanner = "owasp_scanner.cli:main"
owasp-scanner-web = "owasp_scanner.web:main"

[tool.setuptools.dynamic]
version = { attr = "owasp_scanner.__version__" }

[tool.setuptools.packages.find]
include = ["owasp_scanner*"]

[tool.setuptools.package-data]
owasp_scanner = ["static/*", "rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Plain asserts are how pytest checks results.
"tests/**" = ["S101"]
