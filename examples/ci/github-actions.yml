# OWASP-Aligned Non-intrusive Web Security Scanner in GitHub Actions.
#
# Copy to .github/workflows/owasp-scan.yml in the repository of the site you scan.
# Only scan systems you own or are authorized to test: --yes skips the interactive
# authorization prompt, so the approval must already exist for TARGET_URL.
#
# Exit codes: 0 pass, 1 finding at or above --fail-on, 3 target could not be scanned.
name: owasp-scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"  # every Monday 02:00 UTC

permissions:
  contents: read
  security-events: write  # upload SARIF to code scanning

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: https://staging.example.com  # the approved target
      SCANNER_REF: v1.8.0                       # tag or commit of hkbach/oswap_tool to install
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the scanner
        run: pip install "git+https://github.com/hkbach/oswap_tool@${SCANNER_REF}"

      - name: Scan
        # Add --ca-bundle path/to/ca.pem if the target uses a private CA.
        run: >
          python -m owasp_scanner "$TARGET_URL" --yes --no-color
          --fail-on high
          --json owasp-report.json --sarif owasp-report.sarif --html owasp-report.html

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-scan-reports
          path: owasp-report.*

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: owasp-report.sarif
          category: owasp-scanner
